<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" role="img" aria-label="A phone showing the target number 4 in words and as a dice face, an ivory dice on a green table and the Press the dice button; beside it a dice that rolled a 4 and the words plus 4 points">
<defs>
<radialGradient id="felt" cx=".3" cy=".35" r=".9"><stop offset="0" stop-color="#198058"/><stop offset=".5" stop-color="#167050"/><stop offset="1" stop-color="#0F4A38"/></radialGradient>
<radialGradient id="ivf" cx=".3" cy=".25" r=".95"><stop offset="0" stop-color="#FFFFFA"/><stop offset=".55" stop-color="#F6EFDC"/><stop offset="1" stop-color="#E3D7B8"/></radialGradient>
<radialGradient id="pip" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#5C5C5C"/><stop offset=".5" stop-color="#1A1A1A"/><stop offset="1" stop-color="#000"/></radialGradient>
</defs>
<rect width="700" height="440" rx="28" fill="#E9F2F1"/>
<!-- the phone -->
<rect x="215" y="24" width="270" height="392" rx="34" fill="#0B1F1E"/>
<rect x="229" y="52" width="242" height="336" rx="18" fill="#FFFDF9"/>
<!-- round, progress, score -->
<text x="241" y="72" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F1D1C">Round 3 of 10</text>
<g fill="#FFFFFF" stroke="#8397B3" stroke-width="1.5"><rect x="241" y="79" width="13" height="7" rx="3.5" fill="#1F7A55" stroke="#1F7A55"/><rect x="257" y="79" width="13" height="7" rx="3.5" fill="#7487A4" stroke="#7487A4"/><rect x="273" y="79" width="13" height="7" rx="3.5" fill="#1F7A55" stroke="#1F7A55"/><rect x="289" y="79" width="13" height="7" rx="3.5" fill="#FFE0CC" stroke="#C2410C"/><rect x="305" y="79" width="13" height="7" rx="3.5"/><rect x="321" y="79" width="13" height="7" rx="3.5"/><rect x="337" y="79" width="13" height="7" rx="3.5"/><rect x="353" y="79" width="13" height="7" rx="3.5"/><rect x="369" y="79" width="13" height="7" rx="3.5"/><rect x="385" y="79" width="13" height="7" rx="3.5"/></g>
<rect x="408" y="58" width="54" height="38" rx="11" fill="#14284B"/>
<text x="435" y="71" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="700" fill="#CFE0FF" letter-spacing="1">SCORE</text>
<text x="435" y="89" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#FFD54F">10</text>
<!-- the target in words and as a dice face -->
<rect x="237" y="104" width="226" height="62" rx="13" fill="#FFF4CC" stroke="#D99A00" stroke-width="2"/>
<rect x="246" y="113" width="44" height="44" rx="12" fill="#FFFFFF" stroke="#D99A00" stroke-width="2"/>
<rect x="252" y="119" width="32" height="32" rx="8" fill="url(#ivf)" stroke="#B9AB86" stroke-width="1"/>
<g fill="url(#pip)"><circle cx="260" cy="127" r="3.6"/><circle cx="276" cy="127" r="3.6"/><circle cx="260" cy="143" r="3.6"/><circle cx="276" cy="143" r="3.6"/></g>
<text x="300" y="127" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700" fill="#4A3300" letter-spacing="1">DICE ROUND 4 OF 10</text>
<text x="300" y="143" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#4A3300">Target number <tspan font-size="19" font-weight="800" fill="#4A148C">4</tspan></text>
<text x="300" y="157" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="500" fill="#4A3300">Roll a 4 and you score 4 points.</text>
<!-- the table with an ivory dice (the 6 on top), the number to come -->
<rect x="237" y="174" width="226" height="118" rx="16" fill="url(#felt)" stroke="#0B3E2F" stroke-width="3"/>
<ellipse cx="306" cy="276" rx="30" ry="5" fill="#000" opacity=".4"/>
<polygon points="306,206 344,221 306,236 268,221" fill="#FFFDF3" stroke="#BDAE88" stroke-width="1"/>
<polygon points="268,221 306,236 306,274 268,259" fill="#F2EAD3" stroke="#BDAE88" stroke-width="1"/>
<polygon points="306,236 344,221 344,259 306,274" fill="#E0D4B5" stroke="#BDAE88" stroke-width="1"/>
<g fill="#111"><ellipse cx="292" cy="218" rx="3.2" ry="1.8"/><ellipse cx="306" cy="223" rx="3.2" ry="1.8"/><ellipse cx="320" cy="218" rx="3.2" ry="1.8"/><ellipse cx="292" cy="224" rx="3.2" ry="1.8"/><ellipse cx="320" cy="224" rx="3.2" ry="1.8"/><ellipse cx="306" cy="217" rx="3.2" ry="1.8"/>
<ellipse cx="279" cy="239" rx="3" ry="3.8"/><ellipse cx="287" cy="248" rx="3" ry="3.8"/><ellipse cx="295" cy="258" rx="3" ry="3.8"/>
<ellipse cx="318" cy="253" rx="2.8" ry="3.8"/><ellipse cx="332" cy="245" rx="2.8" ry="3.8"/></g>
<text x="410" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" letter-spacing="1">YOUR NUMBER</text>
<text x="410" y="262" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF">?</text>
<!-- timer and the button -->
<text x="350" y="311" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#0F1D1C">6 s left to press</text>
<rect x="249" y="323" width="202" height="52" rx="18" fill="#7C2D12"/>
<rect x="249" y="318" width="202" height="52" rx="18" fill="#C2410C"/>
<text x="350" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">Press the dice</text>
<!-- left: the dice has stopped on 4, a match -->
<text x="125" y="128" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#0F1D1C">You rolled 4</text>
<ellipse cx="125" cy="272" rx="50" ry="8" fill="#0F1D1C" opacity=".25"/>
<rect x="70" y="146" width="110" height="110" rx="24" fill="url(#ivf)" stroke="#B9AB86" stroke-width="2"/>
<g fill="url(#pip)"><circle cx="100" cy="176" r="11"/><circle cx="150" cy="176" r="11"/><circle cx="100" cy="226" r="11"/><circle cx="150" cy="226" r="11"/></g>
<rect x="55" y="292" width="140" height="42" rx="13" fill="#FFD54F"/>
<text x="125" y="321" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#3B2A00">+4 points</text>
<g><rect x="48" y="130" width="8" height="12" rx="2" fill="#D84315" transform="rotate(25 52 136)"/><rect x="196" y="140" width="8" height="12" rx="2" fill="#1565C0" transform="rotate(-20 200 146)"/><rect x="40" y="200" width="8" height="12" rx="2" fill="#2E7D32" transform="rotate(40 44 206)"/><rect x="204" y="214" width="8" height="12" rx="2" fill="#F2B705" transform="rotate(-35 208 220)"/><rect x="62" y="108" width="8" height="12" rx="2" fill="#6A1B9A" transform="rotate(-10 66 114)"/><rect x="186" y="110" width="8" height="12" rx="2" fill="#00796B" transform="rotate(30 190 116)"/></g>
<!-- right: it rolls on your screen -->
<path d="M520 120 C560 90 640 100 662 150" fill="none" stroke="#8397B3" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/>
<ellipse cx="596" cy="270" rx="44" ry="7" fill="#0F1D1C" opacity=".25"/>
<g transform="rotate(-14 596 205)"><polygon points="596,150 650,172 596,194 542,172" fill="#FFFDF3" stroke="#BDAE88" stroke-width="1.5"/><polygon points="542,172 596,194 596,252 542,230" fill="#F2EAD3" stroke="#BDAE88" stroke-width="1.5"/><polygon points="596,194 650,172 650,230 596,252" fill="#E0D4B5" stroke="#BDAE88" stroke-width="1.5"/>
<g fill="#111"><ellipse cx="596" cy="172" rx="5.5" ry="3"/><ellipse cx="576" cy="165" rx="5.5" ry="3"/><ellipse cx="616" cy="179" rx="5.5" ry="3"/><ellipse cx="560" cy="205" rx="5" ry="6.5"/><ellipse cx="578" cy="229" rx="5" ry="6.5"/><ellipse cx="623" cy="222" rx="5" ry="6.5"/><ellipse cx="637" cy="206" rx="5" ry="6.5"/></g></g>
<text x="596" y="300" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#0F1D1C">It rolls on your screen</text>
<text x="596" y="320" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#2B403E">then slows down and stops</text>
</svg>
